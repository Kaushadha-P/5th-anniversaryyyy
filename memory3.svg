<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="100%" stop-color="#242b3d" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd599" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffd599" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#rainGrad)" />
  <!-- Window Pane -->
  <rect x="50" y="50" width="400" height="340" rx="10" fill="#1b2130" stroke="#374158" stroke-width="8" />
  <line x1="250" y1="50" x2="250" y2="390" stroke="#374158" stroke-width="6" />
  <line x1="50" y1="220" x2="450" y2="220" stroke="#374158" stroke-width="6" />
  <!-- Raindrops on glass -->
  <circle cx="120" cy="110" r="3" fill="#68789c" opacity="0.6" />
  <circle cx="124" cy="125" r="2.5" fill="#68789c" opacity="0.5" />
  <circle cx="340" cy="90" r="3" fill="#68789c" opacity="0.6" />
  <circle cx="190" cy="280" r="4" fill="#68789c" opacity="0.6" />
  <circle cx="380" cy="270" r="3" fill="#68789c" opacity="0.6" />
  <circle cx="310" cy="320" r="3" fill="#68789c" opacity="0.5" />
  <!-- Cozy Warm Lamp on table -->
  <circle cx="250" cy="380" r="140" fill="url(#lampGlow)" />
  <rect x="235" y="380" width="30" height="40" fill="#d49a46" rx="4" />
  <polygon points="210,380 290,380 270,330 230,330" fill="#fce4c8" />
  <!-- Table -->
  <rect x="0" y="420" width="500" height="80" fill="#0f121a" />
  <text x="250" y="470" font-family="'Outfit', sans-serif" font-size="16" fill="#f5c786" font-weight="600" text-anchor="middle" letter-spacing="2">COZY RAINY AFTERNOONS</text>
</svg>

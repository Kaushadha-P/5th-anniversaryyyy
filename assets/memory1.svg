<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#190e2b" />
      <stop offset="60%" stop-color="#3b1b40" />
      <stop offset="100%" stop-color="#833256" />
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb6c1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffb6c1" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="500" height="500" fill="url(#sky1)" />
  <!-- Moon Glow -->
  <circle cx="250" cy="180" r="120" fill="url(#glow1)" />
  <circle cx="250" cy="180" r="50" fill="#fff5ea" />
  <!-- Twinkling stars -->
  <circle cx="100" cy="90" r="2" fill="#fff" opacity="0.8" />
  <circle cx="390" cy="120" r="2.5" fill="#fff" opacity="0.9" />
  <circle cx="320" cy="60" r="1.5" fill="#fff" opacity="0.7" />
  <circle cx="150" cy="220" r="2" fill="#fff" opacity="0.8" />
  <circle cx="420" cy="260" r="1.8" fill="#fff" opacity="0.6" />

  <!-- Cups -->
  <path d="M 190 370 L 220 370 L 215 400 L 195 400 Z" fill="#fdfbf7" />
  <path d="M 280 370 L 310 370 L 305 400 L 285 400 Z" fill="#fdfbf7" />
  <!-- Heart Steam -->
  <path d="M 205 345 C 205 330 225 330 225 345 C 225 360 205 365 205 365 C 205 365 185 360 185 345 C 185 330 205 330 205 345 Z" fill="#ff758f" opacity="0.75" />
  <path d="M 295 340 C 295 325 315 325 315 340 C 315 355 295 360 295 360 C 295 360 275 355 275 340 C 275 325 295 325 295 340 Z" fill="#ff758f" opacity="0.75" />
  <!-- Caption text -->
  <text x="250" y="470" font-family="'Outfit', sans-serif" font-size="16" fill="#f5c786" font-weight="600" text-anchor="middle" letter-spacing="2">FIRST DATE MAGIC</text>

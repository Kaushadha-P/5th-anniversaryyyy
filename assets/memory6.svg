<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldMilestone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0a28" />
      <stop offset="50%" stop-color="#3d1445" />
      <stop offset="100%" stop-color="#14081c" />
    </linearGradient>
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c786" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e6396f" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#goldMilestone)" />
  <!-- Golden Ring of Starlight -->
  <circle cx="250" cy="210" r="140" fill="none" stroke="#f5c786" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="250" cy="210" r="120" fill="url(#heartGlow)" />
  <!-- Heart Silhouette -->
  <path d="M 250 170 C 250 130 200 120 180 160 C 160 200 250 270 250 270 C 250 270 340 200 320 160 C 300 120 250 130 250 170 Z" fill="#e6396f" />
  <!-- Golden '5' Emblem inside heart -->
  <text x="250" y="222" font-family="'Cormorant Garamond', Georgia, serif" font-size="64" font-weight="700" fill="#fdfbf7" text-anchor="middle">5</text>
  <text x="250" y="248" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" fill="#f5c786" text-anchor="middle" letter-spacing="3">MONTHS</text>
  <!-- Sparkles -->
  <circle cx="140" cy="140" r="3" fill="#fff" />
  <circle cx="360" cy="150" r="2.5" fill="#f5c786" />
  <circle cx="250" cy="50" r="3.5" fill="#fff" />
  <text x="250" y="470" font-family="'Outfit', sans-serif" font-size="16" fill="#f5c786" font-weight="600" text-anchor="middle" letter-spacing="2">TODAY &amp; FOREVER</text>
</svg>

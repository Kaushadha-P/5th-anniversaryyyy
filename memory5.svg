  <path d="M 180 200 L 225 290 L 225 360 L 200 360 L 200 370 L 250 370 L 250 360 L 235 360 L 235 290 L 230 200 Z" fill="none" stroke="#f5c786" stroke-width="4" />
  <!-- Right Glass -->
  <path d="M 320 200 L 275 290 L 275 360 L 300 360 L 300 370 L 250 370 L 250 360 L 265 360 L 265 290 L 270 200 Z" fill="none" stroke="#f5c786" stroke-width="4" />

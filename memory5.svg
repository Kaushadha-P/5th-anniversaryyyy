  </defs>
  <rect width="500" height="500" fill="url(#partyGrad)" />
  <!-- Bokeh Lights -->
  <circle cx="100" cy="120" r="45" fill="#f5c786" opacity="0.15" />
  <circle cx="380" cy="160" r="55" fill="#e6396f" opacity="0.18" />
  <circle cx="260" cy="80" r="35" fill="#ff758f" opacity="0.12" />
  <circle cx="180" cy="220" r="60" fill="#f5c786" opacity="0.15" />
